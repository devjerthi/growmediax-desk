<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GrowMediaX Desk</title>
<meta name="description" content="GrowMediaX client, billing, ads and profit tracker">
<meta name="theme-color" content="#0E1A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrowMediaX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#F2F5FA;--surface:#FFFFFF;--surface-2:#E9EFF7;--ink:#0D1830;--muted:#5A6883;--line:#D8E0EC;
  --brand:#0E1A33;--brand-ink:#FFFFFF;--brand-muted:#9FB0CF;
  --green:#12975A;--blue:#2463EB;--grad:linear-gradient(90deg,#1FB866,#2F7BEA);
  --good:#127A3E;--good-bg:#E3F5EA;--warn:#9A6212;--warn-bg:#FCF1DC;--bad:#B63B34;--bad-bg:#FBE8E6;--info:#1E4FC2;--info-bg:#E6EEFD;
  --focus:#2463EB;--shadow:0 1px 2px rgba(13,24,48,.06),0 4px 16px rgba(13,24,48,.06);
  --display:"Outfit","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0A1326;--surface:#111D35;--surface-2:#182845;--ink:#E6ECF6;--muted:#92A1BD;--line:#243658;
  --brand:#07101F;--green:#35CF7F;--blue:#5E9BFF;
  --good:#5EDB92;--good-bg:#12311F;--warn:#F2BA55;--warn-bg:#352913;--bad:#F47C73;--bad-bg:#3A1B1B;--info:#8DB5FF;--info-bg:#152B52;
  --focus:#5E9BFF;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A1326;--surface:#111D35;--surface-2:#182845;--ink:#E6ECF6;--muted:#92A1BD;--line:#243658;
  --brand:#07101F;--green:#35CF7F;--blue:#5E9BFF;
  --good:#5EDB92;--good-bg:#12311F;--warn:#F2BA55;--warn-bg:#352913;--bad:#F47C73;--bad-bg:#3A1B1B;--info:#8DB5FF;--info-bg:#152B52;
  --focus:#5E9BFF;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#0E1A33}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:24px;padding:12px 22px;font:600 15px var(--body);cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.gbtn:active{transform:scale(.97)}
.lock .btn-link{background:none;border:0;color:#9FB0CF;text-decoration:underline;cursor:pointer;font-size:12.5px}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.mark{font:700 22px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:baseline;gap:0}
.mark b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark small{font:500 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-muted);margin-left:10px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--brand-muted);padding:10px 12px 12px;cursor:pointer;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="true"]{color:#fff;border-image:var(--grad) 1;border-bottom-width:3px;border-bottom-style:solid}
.tab .n{font:500 11px var(--mono);background:rgba(255,255,255,.12);border-radius:9px;padding:1px 6px;margin-left:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.on-brand{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.btn.on-brand:hover{background:rgba(255,255,255,.16)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:24px;font-weight:600}
h2{font-size:17px;font-weight:600}
.sub{color:var(--muted);margin:2px 0 0}
.head{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px}
.head .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 24px/1.2 var(--display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.lead{background:var(--brand);color:#fff;border-color:transparent;position:relative;overflow:hidden}
.kpi.lead .l,.kpi.lead .h{color:var(--brand-muted)}
.kpi.lead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>header .sp{margin-left:auto;display:flex;gap:6px}
.panel .body{padding:14px 16px}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{min-width:0;flex:1}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--muted)}
.amt{font:500 13.5px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{color:var(--good);background:var(--good-bg)}.p-warn{color:var(--warn);background:var(--warn-bg)}.p-bad{color:var(--bad);background:var(--bad-bg)}.p-info{color:var(--info);background:var(--info-bg)}.p-mute{color:var(--muted);background:var(--surface-2)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:16px;margin-bottom:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:150px;padding-top:6px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .stack{width:100%;max-width:44px;display:flex;gap:3px;align-items:flex-end;height:110px}
.bar .b1{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:4px 4px 0 0;min-height:2px}
.bar .b2{flex:1;background:var(--grad);border-radius:4px 4px 0 0;min-height:2px}
.bar .lb{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.qa{display:grid;grid-template-columns:1.2fr 1fr 2fr 70px auto;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 12px 12px}
@media (max-width:700px){.qa{grid-template-columns:1fr 1fr}.qa .wide{grid-column:1/-1}}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
textarea.in{min-height:70px;resize:vertical}
.check{display:inline-flex;align-items:center;gap:8px}
.tick{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.tick[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.tick[aria-pressed="true"]::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
.cat{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:4px;white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(5,10,22,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal header{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal header .x{margin-left:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:16px 18px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.fld .hint{font-size:12px;color:var(--muted);margin-top:3px}
.modal footer{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.modal footer .sp{margin-left:auto;display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.inv{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.bal{font-size:12px;color:var(--muted)}

/* ---------- chart palette (validated light + dark) ---------- */
:root{--c1:#2463EB;--c2:#12975A;--c3:#8B5CF6;--c4:#D97A1E;--c5:#0E9FB0;--c6:#D9467A;--cO:#9AA6BA;--grid:#E4EAF2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#4F8DF5;--c2:#1E9E5E;--c3:#9B7BF0;--c4:#C97F2E;--c5:#1898A8;--c6:#E45E93;--cO:#5D6B86;--grid:#1D2D4D}}
:root[data-theme="dark"]{--c1:#4F8DF5;--c2:#1E9E5E;--c3:#9B7BF0;--c4:#C97F2E;--c5:#1898A8;--c6:#E45E93;--cO:#5D6B86;--grid:#1D2D4D}

/* ---------- reports ---------- */
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.rgrid .span2{grid-column:1/-1}
@media (max-width:860px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.lc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px}
.lc-y{position:relative;height:230px;font:500 11px var(--mono);color:var(--muted);min-width:44px}
.lc-y span{position:absolute;right:0;transform:translateY(-50%);white-space:nowrap}
.lc-plot{position:relative;height:230px}
.lc-grid{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.lc-grid.base{border-top-color:var(--line)}
.lc-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lc-svg path{fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lc-dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.lc-dot.hov{opacity:0;transition:opacity .12s}
.lc-hit{position:absolute;inset:-6px 0;cursor:crosshair}
.lc-cross{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);opacity:0;pointer-events:none;transition:opacity .12s}
.lc-x{grid-column:2;position:relative;height:22px;font-size:11.5px;color:var(--muted)}
.lc-x span{position:absolute;top:6px;transform:translateX(-50%);white-space:nowrap}
@media (max-width:560px){.lc-x.dense span:nth-child(even){display:none}}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.legend2 .sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.legend2 .sq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend2 b{color:var(--ink);font:500 12.5px var(--mono);margin-left:4px}
.hb{display:grid;gap:12px}
.hb-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center}
.hb-lab{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:14px;display:flex;gap:2px;border-radius:0 4px 4px 0}
.hb-fill{height:100%;border-radius:0 4px 4px 0;transform-origin:left center;min-width:2px}
.hb-fill.first{border-radius:0}
.hb-fill.hatch{background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.55) 3px 5px)}
.hb-val{font:500 12.5px var(--mono);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.hb-row{grid-template-columns:1fr auto}.hb-track{grid-column:1/-1;grid-row:2}}
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--line)}
.col{flex:1;height:100%;display:flex;align-items:flex-end;cursor:default}
.col-fill{width:100%;background:var(--c1);border-radius:4px 4px 0 0;transform-origin:bottom;min-height:0}
.col.today .col-fill{background:var(--c2)}
.col:hover .col-fill{filter:brightness(1.15)}
.cols-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.donut{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:480px){.donut{grid-template-columns:1fr;justify-items:center}}
.dn-wrap{position:relative;width:170px;height:170px}
.dn-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.dn-seg{fill:none;stroke-width:6;transition:stroke-width .15s}
.dn-seg:hover{stroke-width:7.5}
.dn-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-center .v{font:600 20px var(--display)}
.dn-center .l{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.dn-leg{display:grid;gap:8px;width:100%}
.dn-leg div{display:flex;align-items:center;gap:8px;font-size:13px}
.dn-leg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-leg .pc{font:500 12px var(--mono);color:var(--muted)}
.sbar{display:flex;gap:2px;height:18px;margin:4px 0 14px}
.sbar div{height:100%;transform-origin:left;min-width:3px}
.sbar div:first-child{border-radius:4px 0 0 4px}.sbar div:last-child{border-radius:0 4px 4px 0}
.sleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sleg div{display:grid;gap:2px}
.sleg .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sleg .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--body);color:#fff}
.sleg .a{font:600 16px var(--display);font-variant-numeric:tabular-nums}
.nodata{height:120px;display:grid;place-items:center;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px;padding:12px}
details.dt{margin-top:12px;font-size:13px}
details.dt summary{cursor:pointer;color:var(--muted)}
details.dt table{min-width:0;margin-top:8px}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;box-shadow:var(--shadow);max-width:240px;opacity:0;transition:opacity .1s}
#tip b{font-weight:600}
#tip .tr{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:12px}

/* ---------- deliverables ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:20px;align-items:start}
.dcard header h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dprog{position:relative;height:6px;background:var(--surface-2);margin:14px 16px 4px;border-radius:3px}
.dprog-fill{height:100%;background:var(--grad);border-radius:3px;transition:width .5s cubic-bezier(.2,.75,.2,1);transform-origin:left}
.dprog-pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55;border-radius:1px;transform:translateX(-1px)}
.dprog-pace::after{content:"";position:absolute;inset:-4px -8px}
.ditem .t{font-size:14px}
.dbar{height:4px;background:var(--surface-2);border-radius:2px;margin-top:6px}
.dbar-fill{height:100%;background:var(--c1);border-radius:2px;transition:width .35s cubic-bezier(.2,.75,.2,1);transform-origin:left}
.dbar-fill.full{background:var(--good)}
.dctl{display:flex;align-items:center;gap:6px}
.dctl .btn{width:30px;height:30px;justify-content:center;padding:0;font-size:16px}
.dcount{font:600 15px var(--mono);min-width:50px;text-align:center;font-variant-numeric:tabular-nums;display:inline-block}
.dcount.full{color:var(--good)}
#app.anim .dprog-fill,#app.anim .dbar-fill{animation:growX .9s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(300ms + var(--r,0)*60ms)}
@keyframes bump{50%{transform:scale(1.3)}}
.dcount.bump{animation:bump .28s}

/* ---------- profit ---------- */
.tgt{height:4px;background:color-mix(in srgb,currentColor 12%,transparent);border-radius:2px;margin-top:8px;overflow:hidden}
.kpi.lead .tgt{background:rgba(255,255,255,.14)}
.tgt-fill{height:100%;background:var(--grad);border-radius:2px;transform-origin:left}
#app.anim .tgt-fill{animation:growX 1s cubic-bezier(.2,.75,.2,1) backwards .5s}
.pc{position:relative;height:180px;display:flex;gap:10px}
.pc-zero{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.pc-tg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted)}
.pc-col{flex:1;position:relative}
.pc-col:hover .pc-bar{filter:brightness(1.12)}
.pc-bar{position:absolute;left:18%;right:18%;background:var(--c2);border-radius:4px 4px 0 0;min-height:1px;transform-origin:bottom}
.pc-bar.neg{background:var(--c6);border-radius:0 0 4px 4px;transform-origin:top}
#app.anim .pc-bar{animation:growY .8s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(300ms + var(--r,0)*50ms)}
.pc-x{display:flex;gap:10px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.pc-x span{flex:1;text-align:center}
@media (max-width:560px){.pc,.pc-x{gap:4px}.pc-x span:nth-child(even){visibility:hidden}}

/* ---------- lock screen ---------- */
body.locked .top,body.locked main{display:none}
.lock{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 80% at 50% 0%,#16284D 0%,#0B1428 55%,#07101F 100%);color:#fff;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.lock-in{width:min(340px,100%);display:grid;gap:18px;justify-items:center;text-align:center;animation:popIn .4s cubic-bezier(.2,.75,.2,1)}
.lock .mark{font-size:28px}
.lock-logo{width:88px;height:88px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:block}
.lock h1{font:600 20px var(--display);margin:0}
.lock p{margin:0;color:#9FB0CF;font-size:13.5px}
.lock .who{font:500 12.5px var(--mono);color:#9FB0CF;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:4px 10px;border-radius:20px}
.pdots{display:flex;gap:14px;height:18px;align-items:center}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.45);transition:background .15s,transform .15s,border-color .15s}
.pdots i.on{background:linear-gradient(135deg,#1FB866,#2F7BEA);border-color:transparent;transform:scale(1.1)}
.pdots.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.key{height:72px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font:500 26px var(--display);cursor:pointer;transition:background .12s,transform .1s;-webkit-tap-highlight-color:transparent}
.key:hover{background:rgba(255,255,255,.12)}
.key:active{transform:scale(.93);background:rgba(255,255,255,.2)}
.key.txt{font:500 13px var(--body);border-color:transparent;background:none}
.lock .msg{min-height:20px;font-size:13px;color:#F4A19A}
.lock .help{font-size:12px;color:#7F90AF;max-width:300px}
.sec-sec{padding:16px 18px;border-top:1px solid var(--line);display:grid;gap:12px}
.sec-sec:first-of-type{border-top:0}
.sec-sec h3{font-size:15px}
.sec-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pinin{font:600 18px var(--mono);letter-spacing:.5em;max-width:180px}
.okline{font-size:13px;line-height:1.9}
.okline .pill{margin-right:6px}
.pinin::placeholder{letter-spacing:normal;font:400 14px var(--body)}
@media (max-width:560px){
  .lg{display:none}
  .top-in{padding-top:10px;gap:8px 12px}
  .mark{font-size:19px}.mark small{display:none}
  .top-actions{gap:6px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .v{font-size:19px}
  .kpi .h{font-size:11.5px}
  h1{font-size:21px}
  main{padding-block:16px 48px;gap:16px}
  .head .sp{margin-left:0}
}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes sweep{from{stroke-dasharray:0 100}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes shine{to{background-position:200% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.mark b{background:linear-gradient(90deg,#1FB866,#2F7BEA,#1FB866);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 5s linear infinite}
#app.anim>*{animation:rise .55s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms)}
#app.anim .kpi,#app.anim .panel,#app.anim .tw{animation:rise .55s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + 60ms)}
#app.anim .row,#app.anim tbody tr{animation:rise .45s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(250ms + var(--r,0)*45ms)}
#app.anim .hb-fill,#app.anim .sbar div{animation:growX .9s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(300ms + var(--r,0)*70ms)}
#app.anim .col-fill,#app.anim .bar .b1,#app.anim .bar .b2{transform-origin:bottom;animation:growY .8s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(300ms + var(--r,0)*25ms)}
#app.anim .lc-svg{animation:reveal 1.3s cubic-bezier(.4,0,.2,1) backwards .25s}
#app.anim .lc-dot:not(.hov){animation:fadeIn .4s backwards 1.4s}
#app.anim .dn-seg{animation:sweep 1s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(250ms + var(--r,0)*120ms)}
.kpi{transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn{transition:transform .1s,filter .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.overlay{animation:fadeIn .18s ease-out}
.modal{animation:popIn .25s cubic-bezier(.2,.75,.2,1)}
.toast{animation:toastIn .25s cubic-bezier(.2,.75,.2,1)}
.tabs{position:relative}
.tab-ink{position:absolute;bottom:0;height:3px;background:var(--grad);border-radius:3px 3px 0 0;transition:left .35s cubic-bezier(.2,.75,.2,1),width .35s cubic-bezier(.2,.75,.2,1)}
.tab[aria-current="true"]{border-bottom-color:transparent!important;border-image:none!important}
.tab{transition:color .2s}
.tab:hover{color:#fff}
.pill.live::before{animation:pulse 1.6s infinite}
.tick{transition:background .15s,border-color .15s,transform .15s}
.tick:active{transform:scale(.85)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="mark">GrowMedia<b>X</b><small>Desk</small></div>
    <div class="top-actions">
      <button class="btn on-brand sm" data-act="settings" type="button">Business<span class="lg"> details</span></button>
      <button class="btn on-brand sm" data-act="security" type="button">Security<span class="lg"> &amp; backup</span></button>
      <button class="btn on-brand sm" data-act="export" id="exportBtn" type="button">Export<span class="lg"> to Excel</span></button>
      <button class="btn on-brand sm" data-act="lockNow" id="lockBtn" type="button" hidden>Lock</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</div>
<main id="app"></main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="tip" role="tooltip"></div>
<div id="lockRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0;
const inr=n=>{const v=Math.round(num(n));return (v<0?'−₹':'₹')+Math.abs(v).toLocaleString('en-IN')};
const rs=n=>'Rs. '+Math.round(num(n)).toLocaleString('en-IN');
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
const today=()=>iso(new Date());
function pd(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtD(s){const d=pd(s);return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}
function fmtDs(s){const d=pd(s);return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'—'}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/864e5)}
const ymOf=s=>s.slice(0,7);
function ymLabel(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'})}
const curYM=()=>today().slice(0,7);

const CATS=['Ads','Design','Reels / Video','Content','Client call','Sales / Pitch','Reporting','Admin'];
const PLATFORMS=['Meta (FB/IG)','Google Ads','YouTube','LinkedIn','Other'];

/* ---------- state ---------- */
const S={clients:[],bills:[],ads:[],logs:[],deliveries:[],expenses:[],settings:{},ready:{clients:false,bills:false,ads:false,logs:false,deliveries:false,expenses:false},expYM:today().slice(0,7),recDone:false,delYM:today().slice(0,7),localDel:{},wq:{},
  view:'dash',db:null,dl:null,dbState:'loading',billFilter:'open',rptRange:'12',adFilter:'Live',logDate:today(),genDone:false,genBusy:false};

/* ---------- derived ---------- */
function billStatus(b){const t=num(b.total),p=num(b.paid);if(p>=t&&t>0)return 'Paid';if(p>0)return b.dueDate<today()?'Overdue':'Partial';return b.dueDate<today()?'Overdue':'Unpaid'}
const bal=b=>Math.max(0,num(b.total)-num(b.paid));
function statusPill(s){if(s==='Live')return `<span class="pill p-good live">Live</span>`;const m={Paid:'p-good',Partial:'p-info',Unpaid:'p-warn',Overdue:'p-bad',Active:'p-good',Paused:'p-warn',Closed:'p-mute',Live:'p-good',Ended:'p-mute',Scheduled:'p-info'};return `<span class="pill ${m[s]||'p-mute'}">${esc(s)}</span>`}
const clientName=id=>(S.clients.find(c=>c.id===id)||{}).name||'—';
function sortedClients(){return [...S.clients].sort((a,b)=>(a.name||'').localeCompare(b.name||''))}

function expectedBills(c,upTo){
  if(c.status!=='Active'||!c.startDate||!num(c.dealAmount))return [];
  const out=[];
  if(c.dealType==='One-time project'){ if(c.startDate<=upTo) out.push(mkBill(c,ymOf(c.startDate),c.startDate,'Project fee — '+(c.service||'Digital marketing'))); return out; }
  const s=pd(c.startDate),t=pd(upTo); let y=s.getFullYear(),m=s.getMonth(),g=0;
  const bd=num(c.billingDay)||s.getDate();
  while((y<t.getFullYear()||(y===t.getFullYear()&&m<=t.getMonth()))&&g++<120){
    const dim=new Date(y,m+1,0).getDate();
    let issue=iso(new Date(y,m,Math.min(bd,dim)));
    if(issue<c.startDate)issue=c.startDate;
    if(c.endDate&&issue>c.endDate)break;
    const ym=`${y}-${String(m+1).padStart(2,'0')}`;
    if(issue<=upTo)out.push(mkBill(c,ym,issue,`Monthly retainer — ${ymLabel(ym)}${c.service?' ('+c.service+')':''}`));
    m++;if(m>11){m=0;y++}
  }
  return out;
}
function nextBillDate(c){
  if(c.status!=='Active'||!c.startDate||!num(c.dealAmount))return null;
  const t=today();
  if(c.dealType==='One-time project')return c.startDate>t?c.startDate:null;
  if(c.startDate>t)return c.startDate;
  const bd=num(c.billingDay)||pd(c.startDate).getDate();
  const d=pd(t);let y=d.getFullYear(),m=d.getMonth();
  for(let i=0;i<3;i++){const dim=new Date(y,m+1,0).getDate();const s=iso(new Date(y,m,Math.min(bd,dim)));if(s>t&&(!c.endDate||s<=c.endDate))return s;m++;if(m>11){m=0;y++}}
  return null;
}
function mkBill(c,ym,issue,desc){
  const amt=num(c.dealAmount),gst=c.gst?Math.round(amt*0.18):0;
  const code=(c.code||'CL').toUpperCase().replace(/[^A-Z0-9]/g,'')||'CL';
  return {_id:`${c.id}_${ym}`,clientId:c.id,clientName:c.name,ym,invoiceNo:`GMX-${ym.replace('-','')}-${code}`,issueDate:issue,
    dueDate:addDays(issue,num(S.settings.dueDays)||7),description:desc,amount:amt,gst,total:amt+gst,paid:0,payments:[],auto:true,createdAt:new Date().toISOString()};
}

/* ---------- auto generation ---------- */
async function autoGenerate(force){
  if(!S.db||S.genBusy)return; if(!force&&S.genDone)return;
  if(!S.ready.clients||!S.ready.bills)return;
  S.genBusy=true;let made=0;
  try{
    const t=today();
    for(const c of S.clients){
      for(const b of expectedBills(c,t)){
        if(S.bills.some(x=>x.id===b._id))continue;
        const ref=S.db.doc('bills/'+b._id);
        const snap=await ref.get(); if(snap.exists)continue;
        const {_id,...body}=b; await ref.set(body); made++;
      }
    }
  }catch(e){toast('Could not generate bills: '+(e.message||e.code))}
  S.genBusy=false;S.genDone=true;
  if(made)toast(`${made} new bill${made>1?'s':''} generated automatically`);
}

/* ---------- rendering ---------- */
const VIEWS=[['dash','Dashboard'],['reports','Reports'],['clients','Clients & deals'],['deliv','Deliverables'],['bills','Bills'],['exp','Expenses'],['ads','Ads live'],['log','Daily log']];
function renderTabs(){
  const openBills=S.bills.filter(b=>billStatus(b)!=='Paid').length;
  const live=S.ads.filter(a=>a.status==='Live').length;
  const n={clients:S.clients.filter(c=>c.status==='Active').length,bills:openBills,ads:live};
  $('#tabs').innerHTML=VIEWS.map(([k,l])=>`<button class="tab" type="button" data-view="${k}" aria-current="${S.view===k}">${l}${n[k]?`<span class="n">${n[k]}</span>`:''}</button>`).join('')+'<span class="tab-ink" id="tabInk"></span>';
  placeInk(false);
}
function placeInk(){
  const ink=$('#tabInk'),act=$('#tabs .tab[aria-current="true"]');if(!ink||!act)return;
  const prev=S.inkPos;
  if(prev){ink.style.transition='none';ink.style.left=prev.l+'px';ink.style.width=prev.w+'px';ink.offsetWidth;ink.style.transition=''}
  ink.style.left=act.offsetLeft+'px';ink.style.width=act.offsetWidth+'px';S.inkPos={l:act.offsetLeft,w:act.offsetWidth};
}
function render(fresh){
  if(S.locked||!S.started){ $('#lockBtn').hidden=true; if(!S.started&&!S.locked){$('#app').innerHTML='<div class="empty">Loading your data…</div>'} return }
  renderTabs();
  $('#lockBtn').hidden=!(S.lock&&S.lock.hash);
  const app=$('#app');
  const keep={};let foc=null;
  if(!fresh){app.querySelectorAll('.qa [id]').forEach(el=>keep[el.id]=el.value);foc=document.activeElement&&app.contains(document.activeElement)?document.activeElement.id:null}
  let top='';
  if(S.offline)top=`<div class="notice">You are offline. Changes are saved on this phone and sync when you are back online.</div>`;
  const v={exp:vExp,deliv:vDeliv,dash:vDash,reports:vReports,clients:vClients,bills:vBills,ads:vAds,log:vLog}[S.view]||vDash;
  const allReady=S.ready.clients&&S.ready.bills&&S.ready.ads&&S.ready.logs&&S.ready.deliveries&&S.ready.expenses;
  let animate=S.lastView!==S.view;
  if(allReady&&!S.readyAnimated){S.readyAnimated=true;animate=true}
  S.lastView=S.view;
  app.classList.remove('anim');
  app.innerHTML=top+v();
  if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    void app.offsetWidth;app.classList.add('anim');
    [...app.children].forEach((c,i)=>c.style.setProperty('--i',i));
    app.querySelectorAll('.kpis,.rgrid,.grid2>div').forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty('--i',i)));
    app.querySelectorAll('.list,tbody,.hb,.sbar,.cols,.bars,.dn-segs,.dgrid,.pc').forEach(g=>[...g.children].forEach((c,i)=>{c.style.setProperty('--r',Math.min(i,14));c.querySelectorAll('.hb-fill,.col-fill,.b1,.b2,.pc-bar').forEach(x=>x.style.setProperty('--r',Math.min(i,30)))}));
    countUp();
  }
  for(const k in keep){const el=document.getElementById(k);if(el&&keep[k]!=='')el.value=keep[k]}
  if(foc){const el=document.getElementById(foc);el&&el.focus()}
  $('#exportBtn').hidden=!S.dl;
}

function vDash(){
  const t=today(),ym=curYM();
  const monthBills=S.bills.filter(b=>b.ym===ym);
  const billed=monthBills.reduce((s,b)=>s+num(b.total),0);
  const received=paymentsIn(ym);
  const pending=S.bills.reduce((s,b)=>s+bal(b),0);
  const active=S.clients.filter(c=>c.status==='Active');
  const mrr=active.filter(c=>c.dealType!=='One-time project').reduce((s,c)=>s+num(c.dealAmount),0);
  const live=S.ads.filter(a=>a.status==='Live');
  const overdue=S.bills.filter(b=>billStatus(b)==='Overdue').sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const dueSoon=S.bills.filter(b=>['Unpaid','Partial'].includes(billStatus(b))&&daysBetween(t,b.dueDate)<=7);
  const adsEnding=live.filter(a=>a.endDate&&daysBetween(t,a.endDate)>=0&&daysBetween(t,a.endDate)<=3);
  const upcoming=active.map(c=>({c,d:nextBillDate(c)})).filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,6);
  const todays=S.logs.filter(l=>l.date===t);
  const behind=delivStatus(ym).filter(x=>x.state==='Behind');
  const nudges=[];
  if(S.uid&&!(S.lock&&S.lock.hash))nudges.push(`<div class="row"><div class="main"><div class="t">Protect this app with a PIN</div><div class="m">Locks automatically on your phone when you step away.</div></div><button class="btn sm pri" type="button" data-act="security">Set PIN</button></div>`);
  const lb=S.settings.lastBackup;if(!lb||daysBetween(lb,t)>30)nudges.push(`<div class="row"><div class="main"><div class="t">Download a backup of your data</div><div class="m">${lb?'Last backup '+fmtD(lb):'No backup yet'}. Keep a copy on your phone or Google Drive.</div></div><button class="btn sm" type="button" data-act="backup">Backup</button></div>`);
  const attn=[
    ...nudges,
    ...behind.map(x=>`<div class="row"><div class="main"><div class="t">${esc(x.c.name)} — deliverables behind schedule</div><div class="m">${x.items.filter(i=>i.done<i.qty).map(i=>`${esc(i.item)} ${i.done}/${i.qty}`).join(' · ')}</div></div><button class="btn sm" type="button" data-act="goDeliv">Open</button></div>`),
    ...overdue.map(b=>`<div class="row"><div class="main"><div class="t">${esc(b.clientName)} — payment overdue</div><div class="m">${esc(b.invoiceNo)} · due ${fmtD(b.dueDate)} · ${daysBetween(b.dueDate,t)} days late</div></div><span class="amt">${inr(bal(b))}</span><button class="btn sm" type="button" data-act="pay" data-id="${b.id}">Record payment</button></div>`),
    ...dueSoon.map(b=>`<div class="row"><div class="main"><div class="t">${esc(b.clientName)} — payment due ${daysBetween(t,b.dueDate)===0?'today':'in '+daysBetween(t,b.dueDate)+' days'}</div><div class="m">${esc(b.invoiceNo)} · ${fmtD(b.dueDate)}</div></div><span class="amt">${inr(bal(b))}</span><button class="btn sm" type="button" data-act="waSend" data-id="${b.id}">WhatsApp</button></div>`),
    ...adsEnding.map(a=>`<div class="row"><div class="main"><div class="t">${esc(clientName(a.clientId))} — ad ends ${fmtDs(a.endDate)}</div><div class="m">${esc(a.name)} · ${esc(a.platform)}</div></div><button class="btn sm" type="button" data-act="editAd" data-id="${a.id}">Open</button></div>`)
  ];
  return `
  <div class="head"><div><h1>${greet()}, Dev</h1><p class="sub">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div>
  <div class="sp"><button class="btn" type="button" data-act="newClient">New client</button><button class="btn pri" type="button" data-act="goLog">Log today's work</button></div></div>
  <section class="kpis" aria-label="Summary">
    <div class="kpi lead"><div class="l">Monthly recurring</div><div class="v" data-count="${mrr}">${inr(mrr)}</div><div class="h">${active.length} active client${active.length===1?'':'s'}</div></div>
    <div class="kpi"><div class="l">Billed · ${ymLabel(ym)}</div><div class="v" data-count="${billed}">${inr(billed)}</div><div class="h">${monthBills.length} bill${monthBills.length===1?'':'s'}</div></div>

function revChart(){
  const d=pd(today());const months=[];
  for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`)}

/* ---------- expenses ---------- */
const EXP_CATS=['Software & tools','Freelancer / team','Own marketing & ads','Equipment','Internet & phone','Travel','Office & rent','Taxes & fees','Other'];
function expensesIn(ym){return S.expenses.filter(e=>(e.date||'').startsWith(ym)).reduce((s,e)=>s+num(e.amount),0)}
async function autoRecurring(){
  if(!S.db||S.recBusy||S.recDone||!S.ready.expenses)return;S.recBusy=true;let made=0;
  try{
    const t=today(),tp=pd(t);
    for(const e of S.expenses.filter(x=>x.recurring&&x.date)){
      const s0=pd(e.date),day=s0.getDate();let y=s0.getFullYear(),m=s0.getMonth()+1,g=0;
      while((y<tp.getFullYear()||(y===tp.getFullYear()&&m<=tp.getMonth()))&&g++<60){
        const dim=new Date(y,m+1,0).getDate();const d=iso(new Date(y,m,Math.min(day,dim)));
        if(e.stopDate&&d>e.stopDate)break;
        if(d<=t){const ym=d.slice(0,7);const id=`rec_${e.id}_${ym}`;
          if(!S.expenses.some(x=>x.id===id)){const ref=S.db.doc('expenses/'+id);const sn=await ref.get();
            if(!sn.exists){await ref.set({date:d,category:e.category,description:e.description,amount:num(e.amount),clientId:e.clientId||'',mode:e.mode||'',recOf:e.id,createdAt:new Date().toISOString()});made++}}}
        m++;if(m>11){m=0;y++}
      }
    }
  }catch(err){toast('Could not add recurring expenses: '+(err.message||err.code))}
  S.recBusy=false;S.recDone=true;if(made)toast(`${made} recurring expense${made>1?'s':''} added for this month`);
}
function editExp(e){
  const isNew=!e;
  openForm({title:isNew?'Add expense':'Edit expense',values:e||{date:S.expYM===curYM()?today():S.expYM+'-01',category:EXP_CATS[0],mode:'UPI'},
    intro:e&&e.recOf?'This entry was copied automatically from a recurring expense. Changing it only affects this month.':'',
    fields:[{k:'description',label:'What was it for?',req:true,full:true,ph:'Canva Pro subscription'},
      {k:'amount',label:'Amount (₹)',type:'number',req:true},{k:'date',label:'Date',type:'date',req:true},
      {k:'category',label:'Category',type:'select',options:EXP_CATS},
      {k:'clientId',label:'For client (optional)',type:'select',options:[['','General / GrowMediaX'],...sortedClients().map(c=>[c.id,c.name])]},
      {k:'mode',label:'Paid via',type:'select',options:['UPI','Card','Bank transfer','Cash']},
      ...(e&&e.recOf?[]:[{k:'recurring',label:'Repeats every month',type:'checkbox',hint:'A copy is added automatically on the same date each month'},{k:'stopDate',label:'Stop repeating after (optional)',type:'date'}])],
    onSave:async v=>{if(!v.amount){toast('Enter an amount');throw 0}v.updatedAt=new Date().toISOString();

    onDelete:isNew?null:async()=>{await S.db.doc('expenses/'+e.id).delete();toast(e.recurring?'Expense deleted. Copies already added for past months stay; delete them separately if needed.':'Expense deleted')}});

function profitChart(months){

function parseDeliv(t){return String(t||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{let m=x.match(/^(\d+)\s*[x×]?\s+(.+)$/i);if(m)return {item:m[2].trim(),qty:+m[1]};m=x.match(/^(.*?)[\s:x×-]*(\d+)$/i);if(m)return {item:m[1].trim(),qty:+m[2]};return null}).filter(x=>x&&x.item&&x.qty>0)}
function fmtDeliv(a){return (a||[]).map(d=>`${d.item} ${d.qty}`).join(', ')}
const delivId=(cid,ym)=>`${cid}_${ym}`;
function delivDone(cid,ym){const id=delivId(cid,ym);const doc=S.deliveries.find(d=>d.id===id);return {...((doc&&doc.done)||{}),...(S.localDel[id]||{})}}
function delivStatus(ym){
  const cur=curYM(),t=pd(today());
  const [y,m]=ym.split('-').map(Number);const dim=new Date(y,m,0).getDate();
  const elapsed=ym<cur?1:ym>cur?0:t.getDate()/dim;
  return sortedClients().filter(c=>(c.deliverables||[]).length&&(c.status==='Active'||S.deliveries.some(d=>d.id===delivId(c.id,ym)))&&(!c.startDate||c.startDate.slice(0,7)<=ym)).map(c=>{
    const done=delivDone(c.id,ym);
    const items=c.deliverables.map(d=>({item:d.item,qty:d.qty,done:num(done[d.item])}));
    const q=items.reduce((s,i)=>s+i.qty,0),dn=items.reduce((s,i)=>s+Math.min(i.done,i.qty),0);
    const pct=q?dn/q:0;
    let state='On track';
    if(pct>=1)state='Complete';else if(ym<cur)state='Missed';else if(ym>cur)state='Upcoming';else if(pct<elapsed-0.15&&t.getDate()>5)state='Behind';
    return {c,items,q,dn,pct,state,elapsed};
  });
}
function bumpDeliv(cid,item,d){
  if(!need())return;
  const ym=S.delYM,id=delivId(cid,ym);
  const cur=delivDone(cid,ym);const next=Math.max(0,num(cur[item])+d);
  S.localDel[id]={...(S.localDel[id]||{}),[item]:next};
  S.bumped=cid+'|'+item;
  render();
  const run=async()=>{await S.db.doc('deliveries/'+id).set({clientId:cid,ym,done:delivDone(cid,ym),updatedAt:new Date().toISOString()})};
  const p=(S.wq[id]||Promise.resolve()).then(run).catch(dbErr);
  S.wq[id]=p;
  p.then(()=>{if(S.wq[id]===p){delete S.wq[id];delete S.localDel[id];render()}});
}

const PAL=['--c1','--c2','--c3','--c4','--c5','--c6'];
function tipHTML(title,rows){return `<b>${esc(title)}</b>`+rows.map(([k,v])=>`<div class="tr"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}
function shortINR(n){n=num(n);const f=(x,s)=>'₹'+(Math.round(x*10)/10).toString()+s;if(n>=1e7)return f(n/1e7,'Cr');if(n>=1e5)return f(n/1e5,'L');if(n>=1e3)return f(n/1e3,'k');return '₹'+Math.round(n)}
function niceMax(v){if(v<=0)return 10000;const p=Math.pow(10,Math.floor(Math.log10(v)));const r=v/p;return (r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*p}
function clientColor(id){const order=[...S.clients].sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')||a.id.localeCompare(b.id));const i=order.findIndex(c=>c.id===id);return i>=0&&i<6?`var(${PAL[i]})`:'var(--cO)'}
function rangeMonths(){
  const t=pd(today()),out=[];
  if(S.rptRange==='fy'){let y=t.getMonth()>=3?t.getFullYear():t.getFullYear()-1;let d=new Date(y,3,1);while(d<=t){out.push(iso(d).slice(0,7));d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out}
  const n=S.rptRange==='6'?6:12;for(let i=n-1;i>=0;i--){const x=new Date(t.getFullYear(),t.getMonth()-i,1);out.push(iso(x).slice(0,7))}return out;
}

/* ---------- tooltip + count-up ---------- */
function showTip(h,x,y){const t=$('#tip');t.innerHTML=h;t.style.opacity=1;const w=t.offsetWidth,hh=t.offsetHeight;let l=x+14,tp=y+14;if(l+w>innerWidth-8)l=x-w-14;if(tp+hh>innerHeight-8)tp=y-hh-14;t.style.left=Math.max(8,l)+'px';t.style.top=Math.max(8,tp)+'px'}
function hideTip(){$('#tip').style.opacity=0}
document.addEventListener('mousemove',e=>{
  if(e.target.closest&&e.target.closest('#lcHit')){lcMove(e);return}
  const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el.dataset.tip,e.clientX,e.clientY);else if($('#tip').style.opacity==='1')lcLeave();
});
document.addEventListener('mouseleave',hideTip);
function countUp(){
  const els=[...document.querySelectorAll('#app [data-count]')];const t0=performance.now(),D=1100;
  const fmt=(el,v)=>el.dataset.fmt==='n'?String(Math.round(v)):el.dataset.fmt==='pct'?Math.round(v)+'%':inr(v);
  els.forEach(el=>el.textContent=fmt(el,0));
  const step=now=>{const p=Math.min(1,(now-t0-150)/D);const e=p<0?0:1-Math.pow(1-p,3);els.forEach(el=>{if(el.isConnected)el.textContent=fmt(el,num(el.dataset.count)*e)});if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

let modalCfg=null;
function field(f,v){
  const id='f_'+f.k,val=v??f.def??'';
  let inp;
  if(f.type==='select')inp=`<select class="in" id="${id}">${f.options.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea class="in" id="${id}">${esc(val)}</textarea>`;
  else if(f.type==='checkbox')return `<div class="fld ${f.full?'full':''}"><label class="check" style="font-weight:500"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.label)}</label>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
  else inp=`<input class="in" id="${id}" type="${f.type||'text'}" value="${esc(val)}" ${f.req?'required':''} ${f.type==='number'?'step="any" min="0"':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<div class="fld ${f.full?'full':''}"><label for="${id}">${esc(f.label)}${f.req?' *':''}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}

const b64e=u=>btoa(String.fromCharCode(...u));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ITER=310000;
async function hashPin(pin,salt,iter){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(salt),iterations:iter,hash:'SHA-256'},key,256);
  return b64e(new Uint8Array(bits));
}
function safeEq(a,b){if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
async function checkPin(pin){const L=S.lock;if(!L||!L.hash)return true;return safeEq(await hashPin(pin,L.salt,L.iter||ITER),L.hash)}
async function makeLock(pin){const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));return {hash:await hashPin(pin,salt,ITER),salt,iter:ITER,autoLock:(S.lock&&S.lock.autoLock)||5,fails:0,lockUntil:0,updatedAt:new Date().toISOString()}}
async function saveLock(obj){await S.lockRef.set(obj);S.lock=obj}

function showLock(msg){

    <div class="mark">GrowMedia<b>X</b></div>
    <div><h1>Enter your PIN</h1><p>GrowMediaX Desk is locked</p></div>

    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" type="button" data-key="${n}">${n}</button>`).join('')}<span></span><button class="key" type="button" data-key="0">0</button><button class="key txt" type="button" data-key="del" aria-label="Delete">Delete</button></div>
    <p class="help">Forgot your PIN? <button class="btn-link" type="button" data-act="forgotPin">Reset it with your Google account</button></p>
  </div></div>`;
  updDots();lockCountdown();

function updDots(){const d=$('#pdots');if(!d)return;[...d.children].forEach((x,i)=>x.classList.toggle('on',i<pinBuf.length))}
function lockCountdown(){
  clearInterval(S.lcT);const L=S.lock;if(!L||!(L.lockUntil>Date.now()))return;
  const tick=()=>{const m=$('#lockMsg');const left=Math.ceil((L.lockUntil-Date.now())/1000);if(!m)return clearInterval(S.lcT);if(left<=0){m.textContent='';clearInterval(S.lcT);return}m.textContent=`Too many wrong attempts. Try again in ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};
  tick();S.lcT=setInterval(tick,1000);
}
async function pinKey(k){
  if(S.pinBusy)return;
  if(S.lock&&S.lock.lockUntil>Date.now())return;
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);updDots();return}
  if(pinBuf.length>=6)return;
  pinBuf+=k;updDots();
  if(pinBuf.length<6)return;
  S.pinBusy=true;const ok=await checkPin(pinBuf);S.pinBusy=false;
  if(ok){
    if(num(S.lock.fails)){try{S.lock={...S.lock,fails:0,lockUntil:0};await S.lockRef.set(S.lock)}catch{}}
    unlock();return;
  }
  const fails=num(S.lock.fails)+1;let lockUntil=0;
  if(fails%5===0)lockUntil=Date.now()+5*60000*Math.pow(2,fails/5-1);
  S.lock={...S.lock,fails,lockUntil};try{await S.lockRef.set(S.lock)}catch{}
  const d=$('#pdots');d.classList.remove('err');void d.offsetWidth;d.classList.add('err');
  pinBuf='';setTimeout(updDots,350);
  const m=$('#lockMsg');if(m)m.textContent=lockUntil?'':`Wrong PIN. ${5-fails%5} attempt${5-fails%5===1?'':'s'} left before a short lockout.`;
  lockCountdown();
}

async function secAction(a,el){

    if(a==='pinSet'){const p1=$('#pinNew').value,p2=$('#pinNew2').value;if(!pinOk(p1))return secMsg('PIN must be exactly 6 digits.',1);if(p1!==p2)return secMsg('The two PINs do not match.',1);

async function readRestore(file){
  const box=$('#restoreBox');if(!file||!box)return;
  try{const d=JSON.parse(await file.text());if(!d||d.app!=='GrowMediaX Desk'||!d.collections)throw new Error('This is not a GrowMediaX Desk backup file.');
    S.pendingRestore=d;const counts=COLLS.map(c=>`${(d.collections[c]||[]).length} ${c}`).join(', ');
    box.innerHTML=`<div class="notice" style="display:grid;gap:10px">Backup from <b>${fmtD((d.exportedAt||'').slice(0,10))}</b>: ${esc(counts)}. Restoring puts these records back and overwrites any with the same ID. Records added after the backup are kept.<div><button class="btn pri" type="button" data-act="restoreGo">Restore now</button></div></div>`;
  }catch(e){box.innerHTML=`<div class="notice">${esc(e.message||'Could not read this file.')}</div>`}
}
async function doRestore(){
  const d=S.pendingRestore;if(!d)return;const box=$('#restoreBox');let n=0,total=COLLS.reduce((s,c)=>s+(d.collections[c]||[]).length,0);
  for(const c of COLLS){for(const r of (d.collections[c]||[])){if(!r||!r.id||typeof r.data!=='object')continue;await S.db.doc(`${c}/${r.id}`).set(r.data);n++;if(box&&n%10===0)box.innerHTML=`<div class="notice">Restoring… ${n}/${total}</div>`}}
  if(d.settings&&typeof d.settings==='object')await S.db.doc('settings/business').set({...d.settings});
  S.pendingRestore=null;if(box)box.innerHTML=`<div class="notice" style="background:var(--good-bg);color:var(--good)">Restored ${n} records.</div>`;toast(`Restored ${n} records`);
}

/* ---------- boot ---------- */
try{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h}catch{}
const CFG=window.GMX_CONFIG||{};
const ALLOWED=String(CFG.allowedEmail||'').trim().toLowerCase();
let AUTH=null,DB=null;const UNSUBS=[];

/* file saving outside Claude: share sheet on iPhone, normal download elsewhere */
function mimeOf(f){return f.endsWith('.pdf')?'application/pdf':f.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':f.endsWith('.json')?'application/json':'application/octet-stream'}
S.dl={save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data],{type:mimeOf(filename)});
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isIOS&&navigator.canShare){try{const file=new File([blob],filename,{type:mimeOf(filename)});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return {status:'saved'}}}catch(e){if(e&&e.name==='AbortError')throw {code:'declined'}}}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  return {status:'saved'};
}};

const G_ICON='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function showLogin(msg){
  S.locked=true;document.body.classList.add('locked');closeModal();
  $('#app').innerHTML='';
  $('#lockRoot').innerHTML=`<div class="lock" role="dialog" aria-modal="true" aria-label="Sign in"><div class="lock-in">
    <img class="lock-logo" src="logo-256.png" alt="GrowMediaX logo" width="88" height="88">
    <div class="mark">GrowMedia<b>X</b></div>
    <div><h1>GrowMediaX Desk</h1><p>Clients, bills, ads and profit in one place</p></div>
    <button class="gbtn" type="button" data-act="login">${G_ICON}Sign in with Google</button>
    <div class="msg" role="alert">${esc(msg||'')}</div>
    <p class="help">Only ${esc(ALLOWED||'the owner')} can sign in.</p>
  </div></div>`;
}
function showSetup(){
  document.body.classList.add('locked');
  $('#lockRoot').innerHTML=`<div class="lock"><div class="lock-in"><img class="lock-logo" src="logo-256.png" alt="GrowMediaX logo" width="88" height="88"><div class="mark">GrowMedia<b>X</b></div><h1>Almost ready</h1>
  <p>Open <b>config.js</b> and paste your Firebase settings and your email, then reload this page. The setup guide (README) has the steps.</p></div></div>`;
}
function googleProvider(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account',login_hint:ALLOWED});return p}
async function doLogin(){
  try{await AUTH.signInWithPopup(googleProvider())}
  catch(e){
    if(e&&e.code==='auth/popup-closed-by-user')return;
    if(e&&['auth/popup-blocked','auth/operation-not-supported-in-environment','auth/cancelled-popup-request'].includes(e.code)){try{await AUTH.signInWithRedirect(googleProvider());return}catch(e2){e=e2}}
    showLogin((e&&e.message)||'Sign-in failed. Try again.');
  }
}
async function forgotPin(){
  try{
    const u=AUTH.currentUser;if(!u)return;
    await u.reauthenticateWithPopup(googleProvider());
    await S.lockRef.delete();S.lock=null;unlock();toast('PIN removed. Set a new one in Security & backup.');
  }catch(e){if(!(e&&e.code==='auth/popup-closed-by-user')){const m=$('#lockMsg');if(m)m.textContent='Google check failed. Try again.'}}
}
async function doLogout(){
  UNSUBS.splice(0).forEach(f=>{try{f()}catch{}});
  try{await AUTH.signOut()}catch{}
  try{await DB.terminate();await DB.clearPersistence()}catch{}
  location.reload();
}
if(!CFG.firebase||!CFG.firebase.apiKey||/PASTE/i.test(CFG.firebase.apiKey)||!ALLOWED){showSetup()}
else{
  firebase.initializeApp(CFG.firebase);
  AUTH=firebase.auth();DB=firebase.firestore();
  AUTH.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  DB.settings({ignoreUndefinedProperties:true,merge:true});
  DB.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  AUTH.getRedirectResult().catch(e=>{if(e&&e.message)S.loginErr=e.message});
  $('#app').innerHTML='<div class="empty">Loading…</div>';
  AUTH.onAuthStateChanged(async u=>{
    if(!u){S.uid=null;S.started=false;showLogin(S.loginErr);return}
    if(!u.emailVerified||String(u.email||'').toLowerCase()!==ALLOWED){const em=u.email;try{await AUTH.signOut()}catch{}showLogin(`${em||'This account'} is not allowed to open this app. Sign in with ${ALLOWED}.`);return}
    S.db=DB;S.dbState='ok';S.uid=u.uid;S.email=u.email;
    S.lockRef=DB.doc(`data/users/${u.uid}/security`);
    try{const sn=await S.lockRef.get();S.lock=sn.exists?sn.data():null}catch{S.lock=null}
    $('#lockRoot').innerHTML='';document.body.classList.remove('locked');S.locked=false;
    if(S.lock&&S.lock.hash&&window.crypto&&crypto.subtle){showLock();return}
    if(!S.started)startApp();else render();
  });
}
addEventListener('online',()=>{S.offline=false;if(S.started)render()});
addEventListener('offline',()=>{S.offline=true;if(S.started)render()});
S.offline=!navigator.onLine;
function startApp(){
  const db=S.db;S.started=true;loadLogo();S.lastAct=Date.now();
  const sub=(key)=>UNSUBS.push(db.collection(key).onSnapshot({includeMetadataChanges:true},snap=>{
    S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache&&!S.ready[key]){S.ready[key]=true;autoGenerate();if(key==='expenses')autoRecurring()}
    const qa=S.keepQA;
    if(qa&&key==='logs'){S.keepQA=null;render(true);const x=$('#qa_task_'+qa);x&&x.focus()}else render();
  },err=>toast(err&&err.code==='permission-denied'?'Access denied by the database. Check the security rules in the setup guide.':'Data connection lost. Refresh the app to reconnect.')));
  ['clients','bills','ads','logs','deliveries','expenses'].forEach(sub);
  UNSUBS.push(db.doc('settings/business').onSnapshot(s=>{S.settings=s.exists?s.data():{bizName:'GrowMediaX'};if(S.ready.clients)render();},()=>{}));
  render();
}
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
